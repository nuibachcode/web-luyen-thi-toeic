version: '3.8'

services:
  auth-db:
    image: postgres:16
    container_name: toeic_auth_db
    environment:
      POSTGRES_USER: toeic_auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-change-me-auth}
      POSTGRES_DB: toeic_auth
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    restart: unless-stopped

  exam-db:
    image: postgres:16
    container_name: toeic_exam_db
    environment:
      POSTGRES_USER: toeic_exam
      POSTGRES_PASSWORD: ${EXAM_DB_PASSWORD:-change-me-exam}
      POSTGRES_DB: toeic_exam
    ports:
      - "5434:5432"
    volumes:
      - exam_data:/var/lib/postgresql/data
    restart: unless-stopped

  catalog-db:
    image: postgres:16
    container_name: toeic_catalog_db
    environment:
      POSTGRES_USER: toeic_catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-change-me-catalog}
      POSTGRES_DB: toeic_catalog
    ports:
      - "5435:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    restart: unless-stopped

  account-service:
    build:
      context: ./backend/account-service
      dockerfile: Dockerfile
    container_name: toeic_account_service
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://toeic_auth:${AUTH_DB_PASSWORD:-change-me-auth}@auth-db:5432/toeic_auth?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-toeic-key}
    ports:
      - "4001:4001"
    depends_on:
      - auth-db
    restart: unless-stopped

  exam-service:
    build:
      context: ./backend/exam-service
      dockerfile: Dockerfile
    container_name: toeic_exam_service
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://toeic_exam:${EXAM_DB_PASSWORD:-change-me-exam}@exam-db:5432/toeic_exam?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-toeic-key}
    ports:
      - "4002:4002"
    depends_on:
      - exam-db
    restart: unless-stopped

  catalog-service:
    build:
      context: ./backend/catalog-service
      dockerfile: Dockerfile
    container_name: toeic_catalog_service
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://toeic_catalog:${CATALOG_DB_PASSWORD:-change-me-catalog}@catalog-db:5432/toeic_catalog?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-toeic-key}
    ports:
      - "4003:4003"
    depends_on:
      - catalog-db
    restart: unless-stopped

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: toeic_ai_service
    environment:
      PORT: 4005
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "4005:4005"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: toeic_api_gateway
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-super-secret-toeic-key}
      ACCOUNT_SERVICE_URL: http://account-service:4001
      AUTH_SERVICE_URL: http://account-service:4001
      EXAM_SERVICE_URL: http://exam-service:4002
      CATALOG_SERVICE_URL: http://catalog-service:4003
      AI_SERVICE_URL: http://ai-service:4005
    ports:
      - "4000:4000"
    depends_on:
      - account-service
      - exam-service
      - catalog-service
      - ai-service
    restart: unless-stopped

volumes:
  auth_data:
  exam_data:
  catalog_data:
